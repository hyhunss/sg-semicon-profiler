<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>SG Semicon US Expansion Briefing</title>
  <style>
    :root{--ink:#0F172A;--navy:#1E293B;--blue:#0072FF;--paper:#F8FAFC;--white:#FFF;--muted:#64748B;--line:#CBD5E1;--soft:#E2E8F0;--green:#047857;--green-bg:#ECFDF5;--green-line:#A7F3D0;--strategic:#1D4ED8;--strategic-bg:#EFF6FF;--strategic-line:#BFDBFE;--watch:#475569;--watch-bg:#F1F5F9}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}a{color:#075DBD;text-underline-offset:3px}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #93C5FD;outline-offset:3px;border-radius:4px}.container{max-width:1140px;margin:0 auto;padding:0 28px 72px}.hero{background:var(--ink);color:#FFF;padding:54px 0 72px;border-bottom:5px solid var(--blue)}.kicker,.eyebrow{margin:0 0 8px;text-transform:uppercase;letter-spacing:.095em;font-size:.75rem;font-weight:800}.kicker{color:#93C5FD}.eyebrow{color:var(--muted)}h1{font-size:clamp(2rem,4vw,3.65rem);line-height:1.03;letter-spacing:-.045em;margin:0 0 12px;overflow-wrap:anywhere}.hero-meta{color:#CBD5E1;margin:0 0 28px;font-size:.9rem}.headline{max-width:980px;font-size:clamp(1.08rem,2vw,1.4rem);line-height:1.45;margin:0;padding-left:20px;border-left:3px solid #60A5FA;overflow-wrap:anywhere}main{padding-top:30px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:-40px 0 36px}.metric{background:#FFF;border:1px solid #E2E8F0;border-radius:14px;padding:20px;box-shadow:0 4px 20px rgba(15,23,42,.05)}.metric strong{display:block;font-size:2rem;line-height:1}.metric span{display:block;color:var(--muted);font-size:.83rem;margin-top:8px}section{margin-top:46px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.section-head h2{font-size:1.55rem;letter-spacing:-.025em;margin:0}.section-head p{max-width:610px;color:var(--muted);margin:0;font-size:.93rem}.action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.action-card,.route-card,.record,.panel{background:#FFF;border:1px solid #E2E8F0;border-radius:15px;padding:22px;box-shadow:0 4px 20px rgba(15,23,42,.05)}.action-card{border-top:4px solid var(--green)}.route-card{border-top:4px solid var(--blue)}.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;min-width:0}.card-head>div{min-width:0}.card-head h3{font-size:1.22rem;line-height:1.2;margin:0;overflow-wrap:anywhere}.badge{display:inline-block;white-space:nowrap;border:1px solid;border-radius:999px;padding:4px 9px;font-size:.72rem;font-weight:800}.priority{background:#ECFDF5;color:#047857;border-color:#A7F3D0}.strategic{background:#EFF6FF;color:#1D4ED8;border-color:#BFDBFE}.watchlist{background:#F1F5F9;color:#475569;border-color:#CBD5E1}.why,.portfolio-action{font-size:.91rem}.portfolio-action{padding:12px;background:#F1F5F9;border-radius:9px}.decision-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.decision-grid div{border-top:1px solid var(--soft);padding-top:9px;min-width:0}.decision-grid .wide{grid-column:1/-1}.decision-grid dt,.meta dt{font-size:.69rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}.decision-grid dd,.meta dd{margin:3px 0 0;font-size:.88rem;overflow-wrap:anywhere}.score-panel{background:var(--navy);color:#FFF;border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(15,23,42,.08)}.score-row{display:grid;grid-template-columns:minmax(180px,32%) 1fr 60px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.12)}.score-row:last-child{border:0}.score-name{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}.score-name strong{overflow-wrap:anywhere;min-width:0}.track{height:10px;background:#475569;border-radius:999px;overflow:hidden;min-width:80px}.track span{display:block;height:100%;background:#60A5FA;border-radius:inherit}.score-total{font-weight:800;font-size:1.15rem;text-align:right}.score-total small{font-size:.72rem;color:#CBD5E1}.route-grid,.record-grid{display:grid;grid-template-columns:1fr;gap:18px}details{border-top:1px solid var(--soft);margin-top:16px;padding-top:12px}summary{cursor:pointer;color:#075DBD;font-weight:750;padding:8px 0;min-height:44px}.details-grid{display:grid;grid-template-columns:minmax(220px,.65fr) 1.35fr;gap:20px;margin:10px 0}.details-grid h4{margin:0 0 8px}.breakdown{list-style:none;margin:0;padding:0}.breakdown li{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid var(--soft);text-transform:capitalize;font-size:.84rem}.breakdown .total{font-size:.94rem;border-bottom:0}.evidence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.evidence{background:#F8FAFC;border:1px solid var(--soft);border-radius:10px;padding:15px;break-inside:avoid}.evidence-top{display:flex;gap:8px;flex-wrap:wrap}.evidence-top span{font-size:.68rem;font-weight:800;color:#475569;background:#E2E8F0;border-radius:999px;padding:3px 7px}.evidence h4{font-size:.93rem;margin:10px 0;overflow-wrap:anywhere}.evidence p{font-size:.82rem}.excerpt{color:#475569}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.meta dd{font-size:.76rem}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel h3{margin-top:0}.numbered{padding-left:1.25rem}.numbered li{padding:5px 0}.guardrails{border-left:4px solid #F59E0B}.exclusions{border-left:4px solid #94A3B8}.exclusion{padding:10px 0;border-bottom:1px solid var(--soft)}.exclusion:last-child{border:0}.exclusion strong{display:block}.controls{display:flex;gap:8px}.controls button{border:1px solid var(--line);background:#FFF;color:var(--ink);border-radius:6px;min-height:36px;padding:6px 14px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.04)}.error{margin:40px auto;max-width:760px;padding:24px;background:#FFF;border:2px solid #B91C1C;border-radius:12px}footer{margin-top:42px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}
    @media(max-width:850px){.action-grid{grid-template-columns:1fr}.score-row{grid-template-columns:minmax(160px,32%) 1fr 52px}.evidence-grid{grid-template-columns:1fr}}
    @media(max-width:620px){.container{padding-left:17px;padding-right:17px}.hero{padding:42px 0 60px}.metrics{grid-template-columns:1fr;margin-top:-32px}.metric{display:flex;align-items:center;justify-content:space-between}.metric strong{font-size:1.65rem}.metric span{margin:0;text-align:right;max-width:160px}.section-head{display:block}.section-head p,.controls{margin-top:8px}.score-row{grid-template-columns:1fr 48px;gap:8px}.score-name{grid-column:1/-1}.track{grid-column:1}.decision-grid,.details-grid,.two-col{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.action-card,.route-card,.record,.panel,.score-panel{padding:17px}}
    @media print{body{background:#FFF;color:#000;font-size:10pt}.container{max-width:none;padding:0 14mm 14mm}.hero{background:#FFF;color:#000;padding:12mm 14mm 8mm;border-bottom:2px solid #000}.hero .container{padding:0}.kicker,.hero-meta{color:#333}.headline{border-left-color:#000}.metrics{margin:5mm 0 8mm;grid-template-columns:repeat(3,1fr)}.metric,.action-card,.route-card,.record,.panel,.score-panel{box-shadow:none;border:1px solid #999;background:#FFF;color:#000;break-inside:avoid}.track{border:1px solid #666;background:#FFF}.track span{background:#555!important}.controls{display:none}details{display:block!important;border-top:1px solid #AAA}details>summary{display:none!important}details:not([open])>:not(summary):not(.details-grid):not(.evidence-grid){display:block!important}details:not([open])>.details-grid,.details-grid{display:grid!important;grid-template-columns:220px 1fr!important;gap:16px!important}details:not([open])>.evidence-grid,.evidence-grid{display:grid!important;grid-template-columns:1fr 1fr!important;gap:12px!important}.evidence,.score-row{break-inside:avoid}.badge{color:#000!important;background:#FFF!important;border-color:#666!important}a{color:#000;text-decoration:underline}section{margin-top:8mm}h2,h3,h4{break-after:avoid}.record{break-inside:auto}footer{color:#333}}
  </style>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script id="canonical-json" type="application/json">__QUALIFIED_SHORTLIST_JSON__</script>
  <script>
  (function(){
    "use strict";
    var app=document.getElementById("app");
    function esc(value){return String(value==null?"":value).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
    function safeLink(url,title){try{var parsed=new URL(url);if(parsed.protocol!=="http:"&&parsed.protocol!=="https:")throw new Error("protocol");return '<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(title)+'</a>';}catch(e){return esc(title);}}
    function badge(value){return '<span class="badge '+esc(String(value).toLowerCase())+'">'+esc(value)+'</span>';}
    function list(items,ordered){var values=Array.isArray(items)&&items.length?items:["None recorded in Step 3."];return '<'+(ordered?'ol class="numbered"':'ul')+'>'+values.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</'+(ordered?'ol':'ul')+'>';}
    function evidence(items){return (items||[]).map(function(e){return '<article class="evidence"><div class="evidence-top"><span>'+esc(e.evidence_role)+'</span><span>'+esc(e.source_focus)+'</span></div><h4>'+safeLink(e.url,e.source_title)+'</h4><dl class="meta"><div><dt>Source type</dt><dd>'+esc(e.source_type)+'</dd></div><div><dt>Source date</dt><dd>'+esc(e.source_date)+'</dd></div><div><dt>Accessed</dt><dd>'+esc(e.accessed_on||"Not recorded")+'</dd></div></dl><p><strong>Supported claim:</strong> '+esc(e.supported_claim)+'</p><p class="excerpt">'+esc(e.evidence_excerpt)+'</p></article>';}).join("");}
    function breakdown(p){return Object.keys(p.score_breakdown||{}).map(function(k){return '<li><span>'+esc(k.replace(/_/g," "))+'</span><strong>'+esc(p.score_breakdown[k])+'</strong></li>';}).join("")+'<li class="total"><span>Total</span><strong>'+esc(p.score)+' / 20</strong></li>';}
    function candidateRecord(p){return '<article class="record"><div class="card-head"><div><p class="eyebrow">'+esc(p.us_cluster)+' · '+esc(p.engagement_role)+'</p><h3>'+esc(p.prospect)+'</h3></div>'+badge(p.classification)+'</div><dl class="decision-grid"><div><dt>SBF stage</dt><dd>'+esc(p.recommended_sbf_stage)+'</dd></div><div><dt>Evidence strength</dt><dd>'+esc(p.evidence_strength)+'</dd></div><div class="wide"><dt>Best buyer path</dt><dd>'+esc(p.best_buyer_path)+'</dd></div><div class="wide"><dt>Recommended SBF action</dt><dd>'+esc(p.recommended_sbf_action)+'</dd></div><div class="wide"><dt>Why this prospect</dt><dd>'+esc(p.why_this_prospect)+'</dd></div><div class="wide"><dt>Timing signal</dt><dd>'+esc(p.timing_signal)+'</dd></div></dl><details><summary>Score, evidence, and verification question</summary><div class="details-grid"><div><h4>Score breakdown</h4><ul class="breakdown">'+breakdown(p)+'</ul></div><div><h4>Verify next</h4><p>'+esc(p.what_to_verify_next)+'</p></div></div><div class="evidence-grid">'+evidence(p.key_evidence)+'</div></details></article>';}
    try{
      var data=JSON.parse(document.getElementById("canonical-json").textContent);
      ["sme_name","generated_at","executive_summary","qualified_shortlist"].forEach(function(k){if(data[k]==null)throw new Error("Missing required Step 3 field: "+k);});
      if(!Array.isArray(data.executive_summary.action_now))throw new Error("Missing required Step 3 field: executive_summary.action_now");
      function normKey(s){return String(s||"").trim().toLowerCase();}
      var byName=new Map();
      data.qualified_shortlist.forEach(function(p){var key=normKey(p.prospect);if(!key)throw new Error("qualified_shortlist contains an empty prospect name");if(byName.has(key))throw new Error("Normalized qualified_shortlist prospect collision: "+p.prospect);byName.set(key,p);});
      function match(name,group){var key=normKey(name);if(!byName.has(key))throw new Error(group+" prospect does not match qualified_shortlist: "+name);return byName.get(key);}
      ["action_now","strategic_routes"].forEach(function(group){var seen=new Set();(data.executive_summary[group]||[]).forEach(function(item){var key=normKey(item.prospect);if(!key)throw new Error(group+" contains an empty prospect name");if(seen.has(key))throw new Error("Normalized duplicate "+group+" prospect: "+item.prospect);seen.add(key);match(item.prospect,group);});});
      var clusters=new Set(data.qualified_shortlist.map(function(p){return p.us_cluster;}).filter(Boolean)).size;
      var actions=data.executive_summary.action_now.map(function(a){var p=match(a.prospect,"action_now");return '<article class="action-card"><div class="card-head"><div><p class="eyebrow">'+esc(p.us_cluster)+' · '+esc(p.engagement_role)+'</p><h3>'+esc(a.prospect)+'</h3></div>'+badge(p.classification)+'</div><p class="why"><strong>Why now:</strong> '+esc(a.why_now)+'</p><p class="portfolio-action"><strong>Executive next action:</strong> '+esc(a.next_sbf_action)+'</p><dl class="decision-grid"><div><dt>SBF stage</dt><dd>'+esc(p.recommended_sbf_stage)+'</dd></div><div><dt>Classification</dt><dd>'+esc(p.classification)+'</dd></div><div class="wide"><dt>Best buyer path</dt><dd>'+esc(p.best_buyer_path)+'</dd></div><div class="wide"><dt>Recommended SBF action</dt><dd>'+esc(p.recommended_sbf_action)+'</dd></div></dl></article>';}).join("");
      var scores=data.qualified_shortlist.map(function(p){var width=Math.max(0,Math.min(100,Number(p.score)*5));return '<div class="score-row"><div class="score-name"><strong>'+esc(p.prospect)+'</strong>'+badge(p.classification)+'</div><div class="track" role="img" aria-label="'+esc(p.prospect)+' score '+esc(p.score)+' out of 20"><span style="width:'+width+'%"></span></div><div class="score-total">'+esc(p.score)+'<small>/20</small></div></div>';}).join("");
      var strategic=(data.executive_summary.strategic_routes||[]).map(function(s){var p=match(s.prospect,"strategic_routes");return '<article class="route-card"><div class="card-head"><div><p class="eyebrow">'+esc(p.us_cluster)+' · '+esc(p.engagement_role)+'</p><h3>'+esc(s.prospect)+'</h3></div>'+badge(p.classification)+'</div><p class="why"><strong>Why strategic:</strong> '+esc(s.why_strategic)+'</p><dl class="decision-grid"><div><dt>SBF stage</dt><dd>'+esc(p.recommended_sbf_stage)+'</dd></div><div><dt>Score</dt><dd>'+esc(p.score)+' / 20</dd></div><div class="wide"><dt>Best buyer path</dt><dd>'+esc(p.best_buyer_path)+'</dd></div></dl></article>';}).join("");
      var exclusions=(data.deprioritized_or_excluded||[]).map(function(x){return '<div class="exclusion"><strong>'+esc(x.prospect_or_group)+'</strong><span>'+esc(x.reason)+'</span></div>';}).join("")||'<p>None recorded in Step 3.</p>';
      document.title="SG Semicon US Expansion Briefing — "+data.sme_name;
      app.innerHTML='<header class="hero"><div class="container"><p class="kicker">SG Semicon US Expansion Briefing</p><h1>'+esc(data.sme_name)+'</h1><p class="hero-meta">Qualification generated at '+esc(data.generated_at)+'</p><p class="headline">'+esc(data.executive_summary.headline)+'</p></div></header><main class="container"><section class="metrics" aria-label="Portfolio metrics"><div class="metric"><strong>'+data.qualified_shortlist.length+'</strong><span>Total Shortlisted Targets</span></div><div class="metric"><strong>'+data.executive_summary.action_now.length+'</strong><span>Immediate Action Targets</span></div><div class="metric"><strong>'+clusters+'</strong><span>Key US Clusters Covered</span></div></section><section><div class="section-head"><div><p class="eyebrow">Executive action board</p><h2>Action Now</h2></div><p>Immediate actions are read directly from the canonical Step 3 executive summary and may include any classification.</p></div><div class="action-grid">'+(actions||'<p>Step 3 recorded no immediate-action targets.</p>')+'</div></section><section><div class="section-head"><div><p class="eyebrow">Aligned comparison</p><h2>Full shortlist score visualizer</h2></div><p>Classification reflects actionability and route maturity, not a mechanical score band.</p></div><div class="score-panel">'+scores+'</div></section><section><div class="section-head"><div><p class="eyebrow">Longer-cycle options</p><h2>Strategic and long-term routes</h2></div></div><div class="route-grid">'+(strategic||'<p>Step 3 recorded no strategic routes.</p>')+'</div></section><section><div class="section-head"><div><p class="eyebrow">Audit trail</p><h2>Full shortlist evidence and verification</h2></div><div class="controls"><button type="button" id="expand">Expand all</button><button type="button" id="collapse">Collapse all</button></div></div><div class="record-grid">'+data.qualified_shortlist.map(candidateRecord).join("")+'</div></section><section class="two-col"><article class="panel guardrails"><p class="eyebrow">Decision risk</p><h3>Critical unknowns</h3>'+list(data.executive_summary.critical_unknowns,false)+'</article><article class="panel"><p class="eyebrow">SBF execution</p><h3>Recommended next steps</h3>'+list(data.recommended_next_steps,true)+'</article></section><section class="two-col"><article class="panel guardrails"><p class="eyebrow">Evidence boundaries</p><h3>Must not overclaim</h3>'+list((data.qualification_logic||{}).must_not_overclaim_caveats,false)+'</article><article class="panel exclusions"><p class="eyebrow">Screened out</p><h3>Deprioritized routes</h3>'+exclusions+'</article></section><footer>Canonical source: '+esc(data.source_capability_profile_path)+' and '+esc(data.source_prospect_directory)+'. This dashboard presents Step 3 analysis without changing it.</footer></main>';
      document.getElementById("expand").addEventListener("click",function(){document.querySelectorAll("details").forEach(function(x){x.open=true;});});
      document.getElementById("collapse").addEventListener("click",function(){document.querySelectorAll("details").forEach(function(x){x.open=false;});});
    }catch(error){app.innerHTML='<div class="error"><h1>Dashboard could not be rendered</h1><p>'+esc(error.message)+'</p></div>';}
  }());
  </script>
</body>
</html>
